schema_version: 1

context:
  version: "23.12.0"

package:
  name: aioprometheus
  version: ${{ version }}

source:
  # 23.12.0 has no PyPI sdist or GitHub tag; pin its release commit.
  url: https://github.com/claws/aioprometheus/archive/2fabe659c3c5259b50ac90c3106df7d41b8a3c74.tar.gz
  sha256: 7fc508d10aa38a157aba7d2b70a1b996fe400da77463b3cc308174b27b4fb020

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - aiohttp
    - orjson
    - quantile-python

tests:
  # test_pusher requires aiohttp-basicauth, which is unavailable on conda-forge.
  - script: pytest -vvv tests --ignore=tests/test_pusher.py
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - fastapi
        - httpx
        - quart
    files:
      source:
        - tests/
  - python:
      imports:
        - aioprometheus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: MIT
  license_file:
    - License/LICENSE
  summary: aioprometheus is a Prometheus Python client library for asyncio-based applications.
  description: |
    aioprometheus is a Prometheus Python client library for asyncio-based applications.
    It provides metrics collection and serving capabilities for use with Prometheus and
    compatible monitoring systems. It supports exporting metrics into text and pushing metrics to a gateway.
  homepage: https://github.com/claws/aioprometheus
  documentation: https://aioprometheus.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - mediocretech
